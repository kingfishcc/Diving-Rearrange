    <script>
        // --- DATA ---
        const exercises = [
            {
                id: 'q1',
                label: '',
                answer: '從十米高臺陶醉於下面的湛藍在跳板與水面之間描畫出從容的曲線讓青春去激起一片雪白的讚嘆',
                ttsText: '從十米高臺陶醉於下面的湛藍在跳板與水面之間描畫出從容的曲線讓青春去激起一片雪白的讚嘆',
                chunks: ['從十米高臺', '陶醉於下面的湛藍', '在跳板與水面之間', '描畫出從容的曲線', '讓青春去激起', '一片雪白的讚嘆']
            }
        ];

        // 用於判斷目前是否正在拖曳，防止放開滑鼠/手指時誤觸點擊事件
        window.isDraggingItem = false;
        
        let completedCount = 0;
        const totalCount = exercises.length;
        const synth = window.speechSynthesis;

        // --- FUNCTIONS ---

        function speak(text, lang = 'zh-TW', rate = 0.90) {
            // 🛡️ 語音引擎相容性與空字串防護
            if (!text || !synth) return; 
            
            synth.cancel();

            // 針對語音進行修正
            let speechText = text;

            const utterThis = new SpeechSynthesisUtterance(speechText);
            utterThis.lang = lang;
            utterThis.rate = rate; // 放慢語速讓新詩更有感覺
            synth.speak(utterThis);
        }

        function renderApp() {
            const container = document.getElementById('container-exercises');

            exercises.forEach((ex) => {
                const card = document.createElement('div');
                card.className = 'exercise-card px-5 py-6 sm:px-8 sm:py-6';
                card.id = `card-${ex.id}`;
                card.dataset.id = ex.id;

                const shuffledWords = [...ex.chunks].sort(() => Math.random() - 0.5);

                // 只有當 label 有內容時才渲染標題區塊
                const labelHTML = ex.label ? `
                    <div class="mb-4 flex items-center gap-4">
                        <h2 class="text-xl font-bold text-gray-700 tracking-wide">${ex.label}</h2>
                    </div>
                ` : '';

                card.innerHTML = `
                    ${labelHTML}
                    
                    <!-- Word Bank -->
                    <div class="word-bank flex flex-wrap gap-3 mb-6 justify-center" id="bank-${ex.id}">
                        ${shuffledWords.map(word => `<div class="word-item">${word}</div>`).join('')}
                    </div>
